name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/medcore_v2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production server and web)
        run: npm audit --omit=dev --audit-level=high -w @medcore/api -w @medcore/web -w @medcore/domain
      # Expo's CLI (dev server, code signing) pulls braces and node-forge advisories with no patched release.
      # They never ship inside the app bundle, so the mobile audit is reported but does not fail the build.
      - name: Dependency audit (mobile, report only)
        run: npm audit --omit=dev --audit-level=high -w @medcore/mobile || true
